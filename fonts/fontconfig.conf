<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer the UI family without forcing a display serif on reading text.
       Existing emoji, script fallback, monospace and rendering policy survive. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Archivo</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Archivo</family></prefer>
  </alias>
</fontconfig>
